name: PR Diff

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  # Browser tests for the printable sheet (context/foundation/test-plan.md §3
  # Phase 4). Its own job rather than a step in `diff`: it needs no AWS
  # credentials and no Neon branch, so coupling it to that job would make it
  # unrunnable whenever those are unavailable, and would add two browser
  # downloads to the longest pole in CI.
  #
  # NOTE: because this is a separate job, it needs its own required-status-check
  # rule under Settings -> Branches to actually gate PRs — the same caveat the
  # `diff` job carries. Unlike deploy.yml there is no dependent job here to
  # provide that automatically.
  print-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # Keyed on the resolved Playwright version: browser builds are pinned to
      # it, so a version bump must miss the cache rather than run new tests
      # against old binaries.
      - name: Resolve Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        working-directory: frontend
        # --with-deps installs the system libraries the browsers need, which the
        # cache does not carry; it is cheap when the browsers themselves hit.
        run: npx playwright install --with-deps chromium firefox

      - name: Run print browser tests
        working-directory: frontend
        run: npm run test:print

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-pr
          path: frontend/playwright-report/
          retention-days: 7

  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches what the backend test suite is actually developed/run
          # against locally (context/foundation/test-plan.md §4) — was 22,
          # a previously-untested mismatch with local dev.
          node-version: 24

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Trust condition is scoped to `pull_request` runs only, and can
          # only assume the read-only cdk diff/lookup path — see
          # infra/lib/constructs/github-oidc-construct.ts.
          role-to-assume: ${{ vars.AWS_DIFF_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build:ts

      # Backend tests hit a real database (test/helper.ts boots the full
      # Fastify app against fastify.sql, no mocking) — @neondatabase/serverless
      # speaks Neon's HTTP protocol, not plain TCP pg, so a generic postgres:
      # service container can't stand in. A fresh branch per run keeps
      # parallel/re-run PRs from colliding and never leaves persistent state.
      - name: Create ephemeral Neon branch for backend tests
        id: neon-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          # No parent_branch — defaults to the project's actual primary
          # branch, whatever it's named in Neon (not necessarily "main").
          branch_name: pr-${{ github.event.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Migrate ephemeral Neon branch
        working-directory: backend
        env:
          NEON_DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: npx node-pg-migrate -d NEON_DATABASE_URL up

      - name: Run backend tests
        working-directory: backend
        env:
          NEON_DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
          # config.ts only checks presence, never format — the one test that
          # would make a real call (translate.test.ts) already stubs
          # app.anthropicClient, so no real Anthropic spend happens here.
          ANTHROPIC_API_KEY: ci-placeholder-key
          # auth.ts builds a CognitoJwtVerifier eagerly at boot, which
          # regex-validates userPoolId's shape (<region>_<alphanumeric>) —
          # this needs to look real, not point at a real pool. Tests inject
          # their own local JWKS (test/helpers/jwks.ts) and never hit AWS.
          COGNITO_USER_POOL_ID: eu-central-1_ciplaceholder1
          COGNITO_CLIENT_ID: ci-placeholder-client-id
        run: npm test

      - name: Delete ephemeral Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: pr-${{ github.event.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Install infra deps
        working-directory: infra
        run: npm ci

      - name: Package backend for Lambda
        working-directory: infra
        run: node scripts/package-backend.mjs

      # Deliberately ahead of the env-writing step below: that step writes
      # frontend/.env.production, which a `test`-mode run never loads anyway,
      # but running first means the suite never even has real Cognito values on
      # disk to pick up. Unlike the backend suite this needs no database and
      # no credentials — everything auth-related is mocked.
      #
      # This install also covers the build step below, which is why that one
      # does not repeat it. Note it must stay a full install: tsconfig.json
      # references tsconfig.vitest.json, so `tsc -b` type-checks test/ and
      # needs the vitest and @testing-library types from devDependencies.
      - name: Run frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Write frontend env from deployed stack outputs
        working-directory: infra
        run: node scripts/write-frontend-env.mjs

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Diff
        working-directory: infra
        run: |
          echo '## CDK Diff' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Same three stacks deploy.yml actually deploys — GithubOidcStack
          # is human-diffed/deployed only (npm run diff:github-oidc),
          # never shown here, so this summary never implies a change that
          # the merge pipeline won't actually apply.
          npx cdk diff InkLingo-FrontendStack InkLingo-AuthStack InkLingo-ApiStack >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
