name: Deploy

on:
  push:
    branches: [main]

# id-token: write is what lets GitHub mint the short-lived OIDC token
# aws-actions/configure-aws-credentials exchanges for AWS credentials —
# no long-lived AWS keys are ever stored as GitHub secrets.
permissions:
  id-token: write
  contents: read

jobs:
  # Browser tests for the printable sheet (context/foundation/test-plan.md §3
  # Phase 4). Its own job rather than a step in `diff`: it needs no AWS
  # credentials and no Neon branch, so it runs in parallel instead of
  # lengthening the critical path. `deploy` below lists it in `needs:`, so a
  # red print test skips the deploy without any branch-protection setup.
  print-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # Keyed on the resolved Playwright version: browser builds are pinned to
      # it, so a version bump must miss the cache rather than run new tests
      # against old binaries.
      - name: Resolve Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox

      - name: Run print browser tests
        working-directory: frontend
        run: npm run test:print

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-deploy
          path: frontend/playwright-report/
          retention-days: 7

  # Runs immediately on every push to main, no approval gate — this is
  # what the deploy job's reviewer actually reads before approving, so
  # approval isn't a blind click.
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches what the backend test suite is actually developed/run
          # against locally (context/foundation/test-plan.md §4) — was 22,
          # a previously-untested mismatch with local dev. Unlike the
          # deploy job below, this one isn't pinned to the Lambda runtime.
          node-version: 24

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DIFF_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build:ts

      # Same rationale as pr-diff.yml: @neondatabase/serverless speaks
      # Neon's HTTP protocol, not plain TCP pg, so tests need a real Neon
      # branch, not a postgres: service container. This job runs on every
      # push to main with no approval gate, and `deploy` below `needs: diff`
      # — a failing test here automatically skips the deploy job, no
      # branch-protection configuration required.
      - name: Create ephemeral Neon branch for backend tests
        id: neon-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          # No parent_branch — defaults to the project's actual primary
          # branch, whatever it's named in Neon (not necessarily "main").
          branch_name: deploy-${{ github.sha }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Migrate ephemeral Neon branch
        working-directory: backend
        env:
          NEON_DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: npx node-pg-migrate -d NEON_DATABASE_URL up

      - name: Run backend tests
        working-directory: backend
        env:
          NEON_DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
          # config.ts only checks presence, never format — the one test that
          # would make a real call (translate.test.ts) already stubs
          # app.anthropicClient, so no real Anthropic spend happens here.
          ANTHROPIC_API_KEY: ci-placeholder-key
          # auth.ts builds a CognitoJwtVerifier eagerly at boot, which
          # regex-validates userPoolId's shape (<region>_<alphanumeric>) —
          # this needs to look real, not point at a real pool. Tests inject
          # their own local JWKS (test/helpers/jwks.ts) and never hit AWS.
          COGNITO_USER_POOL_ID: eu-central-1_ciplaceholder1
          COGNITO_CLIENT_ID: ci-placeholder-client-id
        run: npm test

      - name: Delete ephemeral Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: deploy-${{ github.sha }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Install infra deps
        working-directory: infra
        run: npm ci

      - name: Package backend for Lambda
        working-directory: infra
        run: node scripts/package-backend.mjs

      # Same rationale as pr-diff.yml, and the same automatic gate the backend
      # tests get: `deploy` below `needs: diff`, so a red frontend test here
      # skips the deploy job without any branch-protection configuration.
      # This install serves the build step below too, and must include
      # devDependencies — `tsc -b` reaches test/ through tsconfig.vitest.json.
      - name: Run frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Write frontend env from deployed stack outputs
        working-directory: infra
        run: node scripts/write-frontend-env.mjs

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Diff
        working-directory: infra
        run: |
          echo '## CDK Diff — review before approving the deploy job below' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx cdk diff InkLingo-FrontendStack InkLingo-AuthStack InkLingo-ApiStack >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Gated by the "production" GitHub Environment's required reviewers —
  # this job pauses here until manually approved in the Actions UI, even
  # though it already triggered on a push to main. Rebuilds independently
  # rather than sharing artifacts with the diff job, same pattern as
  # pr-diff.yml, to avoid artifact-plumbing complexity for a solo PoC.
  deploy:
    needs: [diff, print-tests]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches the Lambda runtime (NODEJS_22_X)

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Set once, after GithubOidcStack is deployed: GitHub repo ->
          # Settings -> Secrets and variables -> Actions -> Variables.
          # Not a secret — the role ARN alone grants nothing; the trust
          # policy's `sub` condition (scoped to this repo, ref/refs/heads/main)
          # is what actually restricts who can assume it.
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build:ts

      - name: Install infra deps
        working-directory: infra
        run: npm ci

      - name: Package backend for Lambda
        working-directory: infra
        run: node scripts/package-backend.mjs

      - name: Write frontend env from deployed stack outputs
        working-directory: infra
        run: node scripts/write-frontend-env.mjs

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy
        working-directory: infra
        # Explicit stack names, not --all: GithubOidcStack grants the very
        # IAM roles this pipeline runs as, and stays human-deployed-only
        # (see infra/package.json's deploy:github-oidc) — never part of
        # the automated merge-to-main path.
        run: npx cdk deploy InkLingo-FrontendStack InkLingo-AuthStack InkLingo-ApiStack --require-approval never
